<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodDash</title>
  <!-- Tailwind CDN для навчання -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
</head>

<!-- Базовий фон і шрифт -->
<body class="bg-gray-50 font-sans antialiased text-gray-900">
  <!-- Контент тут -->
   <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between gap-6">

    <!-- Логотип -->
    <a href="#" class="flex items-center gap-2 text-xl font-black text-orange-500 shrink-0">
      🍔 FoodDash
    </a>

    <!-- Пошук: прихований на mobile, flex на md+ -->
    <div class="hidden md:flex items-center gap-1 bg-gray-100 rounded-full p-1 flex-1 max-w-sm">
      <span class="pl-3 text-gray-400 text-sm">🔍</span>
      <input
        type="text"
        placeholder="Знайти страву або ресторан..."
        class="bg-transparent flex-1 px-3 py-1.5 text-sm outline-none placeholder-gray-400"
      >
    </div>

    <!-- Права частина -->
    <div class="flex items-center gap-3 shrink-0">

      <!-- Адреса: тільки на md+ -->
      <button class="hidden md:block text-sm font-medium text-gray-600 hover:text-orange-500 transition-colors">
        📍 Київ
      </button>

      <!-- Кошик з лічильником -->
      <button class="relative bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-full text-sm font-bold transition-colors">
        🛒 Кошик
        <!-- Бейдж лічильника -- absolute відносно button -->
        <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs font-bold rounded-full size-5 flex items-center justify-center">
          3
        </span>
      </button>

      <!-- Аватар -->
      <img
        src="https://placehold.co/36x36/f97316/fff?text=OA"
        alt="Профіль"
        class="size-9 rounded-full ring-2 ring-orange-200 object-cover"
        width="36" height="36"
        loading="eager"
      >

    </div>
  </div>
</nav>
<section class="bg-gradient-to-br from-orange-500 via-orange-400 to-yellow-400 overflow-hidden">
  <div class="max-w-7xl mx-auto px-6 py-16 md:py-20 flex flex-col md:flex-row items-center gap-10">

    <!-- Текстовий блок -->
    <div class="flex-1 text-white">

      <!-- Бейдж -->
      <div class="inline-flex items-center gap-2 bg-white/20 text-white text-xs font-bold px-3 py-1.5 rounded-full mb-5">
        🔥 Топ доставка Києва 2024
      </div>

      <!-- Заголовок: великий на lg, менший на mobile -->
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-black leading-tight mb-4">
        Смачна їжа

        прямо <span class="text-yellow-200">до дверей</span>
      </h1>

      <p class="text-orange-100 text-lg mb-8 max-w-md">
        Замовляй з 500+ ресторанів. Доставка за 30 хвилин або безкоштовно.
      </p>

      <!-- Кнопки: вертикально на mobile, горизонтально на sm+ -->
      <div class="flex flex-col sm:flex-row gap-3 mb-10">
        <button class="bg-white text-orange-500 font-bold px-6 py-3 rounded-full hover:bg-orange-50 transition-colors">
          🛍️ Замовити зараз
        </button>
        <button class="border-2 border-white/50 text-white font-semibold px-6 py-3 rounded-full hover:bg-white/10 transition-colors">
          📍 Вибрати адресу
        </button>
      </div>

      <!-- Статистика: flex з роздільниками -->
      <div class="flex gap-8">
        <div>
          <div class="text-2xl font-black">500+</div>
          <div class="text-orange-200 text-sm">ресторанів</div>
        </div>
        <div class="border-l border-white/30 pl-8">
          <div class="text-2xl font-black">30 хв</div>
          <div class="text-orange-200 text-sm">доставка</div>
        </div>
        <div class="border-l border-white/30 pl-8">
          <div class="text-2xl font-black">4.9★</div>
          <div class="text-orange-200 text-sm">рейтинг</div>
        </div>
      </div>
    </div>

    <!-- Правий блок: emoji-ілюстрація з декоративними картками -->
    <div class="flex-1 flex justify-center relative">
      <div class="relative">

        <!-- Головний круг -->
        <div class="w-64 h-64 md:w-72 md:h-72 bg-white/20 rounded-full flex items-center justify-center">
          <span class="text-8xl">🍔</span>
        </div>

        <!-- Декоративна картка 1 -- справа зверху (absolute) -->
        <div class="absolute -top-4 -right-4 bg-white rounded-2xl p-3 shadow-xl text-center animate-bounce">
          <div class="text-2xl">🍕</div>
          <div class="text-xs font-bold text-gray-700 mt-1">Піца</div>
          <div class="text-xs text-orange-500">25 хв</div>
        </div>

        <!-- Декоративна картка 2 -- зліва знизу -->
        <div class="absolute -bottom-2 -left-6 bg-white rounded-2xl p-3 shadow-xl text-center">
          <div class="text-2xl">🍜</div>
          <div class="text-xs font-bold text-gray-700 mt-1">Рамен</div>
          <div class="text-xs text-orange-500">35 хв</div>
        </div>

      </div>
    </div>

  </div>
</section>

        transition-colors
      ">
              <span class="text-2xl">🍔</span>
        <span class="text-xs">Бургери</span>
      </button>

      <!-- Неактивна категорія -->
      <button class="

        bg-gray-50 hover:bg-orange-50
        text-gray-700
        px-5 py-3

        border border-gray-100
        transition-colors
      ">
              <span class="text-2xl">🍔</span>
        <span class="text-xs">Бургери</span>
      </button>

      <!-- Неактивна категорія -->
      <button class="
        shrink-0
        flex flex-col items-center gap-1.5
        bg-gray-50 hover:bg-orange-50
        text-gray-700
        px-5 py-3
        rounded-2xl
        border border-gray-100
        transition-colors
      ">
    </div>
  </div>
</section>
</body>
</html>
